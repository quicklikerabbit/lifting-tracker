<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic Info -->
    <title>Lifting Tracker</title>
    <meta
      name="description"
      content="Track your lifting progress and reach your fitness goals."
    />

    <!-- PWA & "Add to Home Screen" -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lifting" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Social Sharing / Open Graph -->
    <meta property="og:title" content="Lifting Tracker" />
    <meta
      property="og:description"
      content="Track your lifting progress and reach your fitness goals."
    />
    <meta
      property="og:image"
      content="https://sixpack.syncline.ca/og-image.png"
    />
    <meta property="og:url" content="https://sixpack.syncline.ca" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
